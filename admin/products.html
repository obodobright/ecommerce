<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Products - Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="../index.html">
          <i class="bi bi-shop"></i> Ecommerce Admin
        </a>
        <div class="ms-auto">
          <span class="navbar-text me-3" id="adminName"></span>
          <a class="btn btn-outline-light btn-sm" href="../index.html">
            <i class="bi bi-box-arrow-right"></i> Logout
          </a>
        </div>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row">
        <div class="col-md-2 admin-sidebar">
          <ul class="nav flex-column">
            <li class="nav-item">
              <a class="nav-link" href="dashboard.html">
                <i class="bi bi-speedometer2"></i> Dashboard
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="products.html">
                <i class="bi bi-box-seam"></i> Products
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="orders.html"> <i class="bi bi-cart-check"></i> Orders </a>
            </li>
          </ul>
        </div>

        <div class="col-md-10 admin-content">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Manage Products</h2>
            <button
              class="btn btn-primary"
              data-bs-toggle="modal"
              data-bs-target="#productModal"
              onclick="openProductModal()"
            >
              <i class="bi bi-plus-circle"></i> Add New Product
            </button>
          </div>

          <div class="card">
            <div class="card-body">
              <div class="table-responsive">
                <table class="table table-hover">
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Image</th>
                      <th>Name</th>
                      <th>Category</th>
                      <th>Price</th>
                      <th>Stock</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody id="productsTable">
                    <!-- using dom to manaipulate and populate data in this place -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Product Modal -->
    <div class="modal fade" id="productModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="productModalTitle">Add New Product</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="productForm">
              <input type="hidden" id="productId" />
              <div class="mb-3">
                <label for="productName" class="form-label">Product Name</label>
                <input type="text" class="form-control" id="productName" required />
              </div>
              <div class="mb-3">
                <label for="productCategory" class="form-label">Category</label>
                <select class="form-select" id="productCategory" required>
                  <option value="">Select Category</option>
                  <option value="mens">mens</option>
                  <option value="womens">womens</option>
                  <option value="kids">kids</option>
                  <option value="footwear">footwear</option>
                  <option value="accessories">accessories</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="productDescription" class="form-label">Description</label>
                <textarea class="form-control" id="productDescription" rows="3" required></textarea>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="productPrice" class="form-label">Price ($)</label>
                  <input
                    type="number"
                    class="form-control"
                    id="productPrice"
                    step="0.01"
                    min="0"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="productStock" class="form-label">Stock</label>
                  <input type="number" class="form-control" id="productStock" min="0" required />
                </div>
              </div>
              <div class="mb-3">
                <label for="productImage" class="form-label">Image URL</label>
                <input type="url" class="form-control" id="productImage" required />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" onclick="saveProduct()">
              Save Product
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
    <script>
      let editingProductId = null;

      async function loadProducts() {
        const user = api.getCurrentUser();

        if (!user || user.role !== "admin" || !api.getAuthToken()) {
          window.location.href = "login.html";
          return;
        }

        document.getElementById("adminName").textContent = user.fullName || user.email;

        try {
          const products = await api.products.getAll();
          const tableBody = document.getElementById("productsTable");

          if (products.length === 0) {
            tableBody.innerHTML =
              '<tr><td colspan="7" class="text-center">No products found. Add your first product!</td></tr>';
          } else {
            tableBody.innerHTML = products
              .map((product) => {
                const stockStatus = getStockStatus(product.stock);
                return `
                            <tr>
                                <td>${product.id}</td>
                                <td><img src="${
                                  product.image || "https://via.placeholder.com/50x50"
                                }" alt="${
                  product.name
                }" style="width: 50px; height: 50px; object-fit: cover;"></td>
                                <td>${product.name}</td>
                                <td><span class="badge bg-secondary">${product.category}</span></td>
                                <td>${formatPrice(product.price)}</td>
                                <td>
                                    <span class="${stockStatus.class}">${product.stock}</span>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-primary" onclick="editProduct(${
                                      product.id
                                    })">
                                        <i class="bi bi-pencil"></i> Edit
                                    </button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteProduct(${
                                      product.id
                                    })">
                                        <i class="bi bi-trash"></i> Delete
                                    </button>
                                </td>
                            </tr>
                        `;
              })
              .join("");
          }
        } catch (error) {
          console.error("Error loading products:", error);
          alert("Error loading products. Please try again.");
        }
      }

      function openProductModal() {
        editingProductId = null;
        document.getElementById("productModalTitle").textContent = "Add New Product";
        document.getElementById("productForm").reset();
        document.getElementById("productId").value = "";
      }

      async function editProduct(productId) {
        try {
          const product = await api.products.getById(productId);

          editingProductId = productId;
          document.getElementById("productModalTitle").textContent = "Edit Product";
          document.getElementById("productId").value = product.id;
          document.getElementById("productName").value = product.name;
          document.getElementById("productCategory").value = product.category;
          document.getElementById("productDescription").value = product.description || "";
          document.getElementById("productPrice").value = product.price;
          document.getElementById("productStock").value = product.stock;
          document.getElementById("productImage").value = product.image || "";

          const modal = new bootstrap.Modal(document.getElementById("productModal"));
          modal.show();
        } catch (error) {
          alert("Error loading product details");
        }
      }

      async function saveProduct() {
        const form = document.getElementById("productForm");
        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const productData = {
          name: document.getElementById("productName").value,
          category: document.getElementById("productCategory").value,
          description: document.getElementById("productDescription").value,
          price: parseFloat(document.getElementById("productPrice").value),
          stock: parseInt(document.getElementById("productStock").value),
          image: document.getElementById("productImage").value,
        };

        try {
          if (editingProductId) {
            await api.admin.updateProduct(editingProductId, productData);
          } else {
            await api.admin.createProduct(productData);
          }

          await loadProducts();

          const modal = bootstrap.Modal.getInstance(document.getElementById("productModal"));
          modal.hide();
        } catch (error) {
          alert(error.message || "Failed to save product");
        }
      }

      async function deleteProduct(productId) {
        if (!confirm("Are you sure you want to delete this product?")) {
          return;
        }

        try {
          await api.admin.deleteProduct(productId);
          await loadProducts();
        } catch (error) {
          alert(error.message || "Failed to delete product");
        }
      }

      document.addEventListener("DOMContentLoaded", loadProducts);
    </script>
  </body>
</html>
