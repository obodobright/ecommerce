<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Deo Essentials</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../css/style.css" />

    <!-- Page-specific modern styling to match landing page -->
    <style>
      :root {
        --deo-gradient: linear-gradient(135deg, #ff6cab 0%, #7366ff 50%, #38c6ff 100%);
        --deo-dark: #050816;
        --deo-pill-bg: rgba(255, 255, 255, 0.12);
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(circle at top left, #ffe6f3 0, transparent 45%),
          radial-gradient(circle at bottom right, #e0f3ff 0, transparent 45%), #ffffff;
      }

      .navbar {
        backdrop-filter: blur(18px);
        background: rgba(5, 8, 22, 0.9) !important;
      }

      .navbar-brand {
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .navbar-brand span {
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--deo-pill-bg);
        font-size: 0.75rem;
        margin-left: 8px;
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
      }

      .auth-card {
        max-width: 520px;
        width: 100%;
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(148, 163, 184, 0.35);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.16);
        padding: 2.25rem 2rem;
      }

      .auth-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.3rem 0.8rem;
        border-radius: 999px;
        background: rgba(79, 70, 229, 0.06);
        color: #4338ca;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      .auth-title {
        letter-spacing: -0.04em;
        font-weight: 700;
      }

      .btn-auth-primary {
        background: #000;
        color: #ffffff;
        border: none;
        font-weight: 600;
      }

      .btn-auth-primary:hover {
        filter: brightness(1.05);
      }

      footer {
        background: #020617 !important;
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="../index.html">
          <i class="bi bi-shop"></i> Deo Essentials
          <span>AI ready</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="products.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="login.html">Login</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main>
      <div class="auth-card">
        <div class="text-center mb-3">
          <div class="auth-badge">
            <i class="bi bi-stars"></i>
            New here?
          </div>
        </div>
        <h2 class="auth-title h3 text-center mb-2">Create your Deo Essentials account</h2>
        <p class="text-muted text-center mb-4" style="font-size: 0.9rem">
          Save your details once, and we’ll keep checkout fast and your favorites in sync.
        </p>
        <form id="registerForm">
          <div class="mb-3">
            <label for="fullName" class="form-label">Full name</label>
            <input type="text" class="form-control" id="fullName" required />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" required />
          </div>
          <div class="mb-3">
            <label for="phone" class="form-label">Phone number</label>
            <input type="tel" class="form-control" id="phone" required />
          </div>
          <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <textarea class="form-control" id="address" rows="3" required></textarea>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required minlength="6" />
          </div>
          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm password</label>
            <input type="password" class="form-control" id="confirmPassword" required />
          </div>
          <div class="alert alert-danger" id="errorAlert" style="display: none"></div>
          <button type="submit" class="btn btn-auth-primary w-100 mb-3">
            <i class="bi bi-person-plus me-1"></i> Register
          </button>
          <p class="text-center mb-0" style="font-size: 0.9rem">
            Already have an account? <a href="login.html">Login here</a>
          </p>
        </form>
      </div>
    </main>

    <footer class="bg-dark text-light py-3">
      <div class="container text-center">
        <p class="mb-0" style="font-size: 0.8rem; opacity: 0.85">
          &copy; 2026 Deo Essentials. All rights reserved.
        </p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
      document.getElementById("registerForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const fullName = document.getElementById("fullName").value;
        const email = document.getElementById("email").value;
        const phone = document.getElementById("phone").value;
        const address = document.getElementById("address").value;
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const errorAlert = document.getElementById("errorAlert");
        const submitBtn = this.querySelector('button[type="submit"]');

        // Validation
        if (password !== confirmPassword) {
          errorAlert.textContent = "Passwords do not match!";
          errorAlert.style.display = "block";
          return;
        }

        if (password.length < 6) {
          errorAlert.textContent = "Password must be at least 6 characters!";
          errorAlert.style.display = "block";
          return;
        }

        // Disable button and show loading
        submitBtn.disabled = true;
        submitBtn.textContent = "Registering...";
        errorAlert.style.display = "none";

        try {
          const response = await api.auth.register({
            fullName,
            email,
            phone,
            address,
            password,
          });

          // Redirect to products page
          window.location.href = "products.html";
        } catch (error) {
          errorAlert.textContent = error.message || "Registration failed. Please try again.";
          errorAlert.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = "Register";
        }
      });
    </script>
  </body>
</html>
