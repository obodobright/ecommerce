<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation - Ecommerce Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <i class="bi bi-shop"></i> Ecommerce Store
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Products</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Order Confirmation -->
    <div class="container">
        <div class="order-confirmation">
            <i class="bi bi-check-circle-fill"></i>
            <h2 class="mb-3">Order Confirmed!</h2>
            <p class="lead mb-4">Thank you for your purchase. Your order has been received and is being processed.</p>
            
            <div class="card mx-auto" style="max-width: 600px;">
                <div class="card-body">
                    <h5 class="card-title mb-4">Order Details</h5>
                    <div id="orderDetails">
                        <!-- Order details will be loaded here -->
                    </div>
                </div>
            </div>
            
            <div class="mt-4">
                <a href="products.html" class="btn btn-primary btn-lg me-2">
                   Continue Shopping
                </a>
                <a href="../index.html" class="btn btn-outline-secondary btn-lg">
                     Back to Home
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <p>&copy; 2025 Ecommerce Store. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
    <script>
        async function loadOrderConfirmation() {
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = parseInt(urlParams.get('orderId'));
            
            if (!orderId) {
                alert('Invalid order!');
                window.location.href = 'products.html';
                return;
            }
            
            try {
                const order = await api.orders.getById(orderId);
                
                const orderDetailsDiv = document.getElementById('orderDetails');
                orderDetailsDiv.innerHTML = `
                    <p><strong>Order ID:</strong> #${order.id}</p>
                    <p><strong>Order Date:</strong> ${new Date(order.created_at).toLocaleString()}</p>
                    <hr>
                    <h6>Items:</h6>
                    <ul class="list-unstyled">
                        ${order.items.map(item => `
                            <li class="mb-2">
                                ${item.productName} x${item.quantity} - ${formatPrice(item.price * item.quantity)}
                            </li>
                        `).join('')}
                    </ul>
                    <hr>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal:</span>
                        <span>${formatPrice(order.subtotal)}</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Tax:</span>
                        <span>${formatPrice(order.tax)}</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <strong>Total:</strong>
                        <strong>${formatPrice(order.total)}</strong>
                    </div>
                    <hr>
                    <h6>Shipping Address:</h6>
                    <p class="mb-0">
                        ${order.shipping_name}<br>
                        ${order.shipping_address}<br>
                        ${order.shipping_city}, ${order.shipping_state} ${order.shipping_zip}<br>
                        Phone: ${order.shipping_phone}
                    </p>
                    <hr>
                    <p><strong>Payment Method:</strong> ${order.payment_method === 'cod' ? 'Cash on Delivery' : 'Credit/Debit Card'}</p>
                    <p><strong>Status:</strong> <span class="badge bg-warning">${order.status}</span></p>
                `;
            } catch (error) {
                console.error('Error loading order:', error);
                alert('Order not found!');
                window.location.href = 'products.html';
            }
        }
        
        document.addEventListener('DOMContentLoaded', loadOrderConfirmation);
    </script>
</body>
</html>
