<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Ecommerce Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <i class="bi bi-shop"></i> Ecommerce Store
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="cart.html">
                            <i class="bi bi-cart"></i> Cart <span class="badge bg-danger cart-count">0</span>
                        </a>
                    </li>
                    <li class="nav-item" id="authNav"></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Cart Content -->
    <div class="container mt-4 mb-5">
        <h2 class="mb-4"><i class="bi bi-cart"></i> Shopping Cart</h2>
        
        <div class="row">
            <div class="col-lg-8">
                <div id="cartItems">
                    <!-- Cart items will be loaded here -->
                </div>
                <div class="alert alert-info" id="emptyCartAlert" style="display: none;">
                    <i class="bi bi-cart-x"></i> Your cart is empty. <a href="products.html">Continue Shopping</a>
                </div>
            </div>
            
            <div class="col-lg-4">
                <div class="cart-summary">
                    <h4>Order Summary</h4>
                    <hr>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Tax (10%):</span>
                        <span id="tax">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span>Shipping:</span>
                        <span>Free</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-3">
                        <strong>Total:</strong>
                        <strong id="total">$0.00</strong>
                    </div>
                    <button class="btn btn-primary w-100" id="checkoutBtn" disabled>
                        <i class="bi bi-credit-card"></i> Proceed to Checkout
                    </button>
                    <a href="products.html" class="btn btn-outline-secondary w-100 mt-2">
                        <i class="bi bi-arrow-left"></i> Continue Shopping
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <p>&copy; 2024 Ecommerce Store. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
    <script>
        function renderAuthNav() {
    const authNav = document.getElementById("authNav");

    const user = api.getCurrentUser();
    const token = api.getAuthToken();

    if (!user || !token) {
        authNav.innerHTML = `
            <a class="nav-link" href="user/login.html">Login</a>
        `;
    } else {
        authNav.innerHTML = `
            <div class="dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle"></i> ${user.fullName || user.username}
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    
                    <li><a class="dropdown-item text-danger" href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </div>
        `;

        setTimeout(() => {
            const logoutBtn = document.getElementById("logoutBtn");
            if (logoutBtn) {
                logoutBtn.addEventListener("click", () => {
                    api.auth.logout();
                    window.location.reload();
                });
            }
        }, 50);
    }
}
        async function loadCart() {
            const user = api.getCurrentUser();
            if (!user || !api.getAuthToken()) {
                window.location.href = 'login.html';
                return;
            }
            
            try {
                const cart = await api.cart.get();
                const cartItemsDiv = document.getElementById('cartItems');
                const emptyCartAlert = document.getElementById('emptyCartAlert');
                
                if (cart.length === 0) {
                    cartItemsDiv.innerHTML = '';
                    emptyCartAlert.style.display = 'block';
                    document.getElementById('checkoutBtn').disabled = true;
                    updateSummary(0);
                    return;
                }
                
                emptyCartAlert.style.display = 'none';
                document.getElementById('checkoutBtn').disabled = false;
                
                let total = 0;
                cartItemsDiv.innerHTML = cart.map(item => {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;
                    
                    return `
                        <div class="cart-item">
                            <div class="row align-items-center">
                                <div class="col-md-2">
                                    <img src="${item.image || 'https://via.placeholder.com/300x300'}" class="img-fluid rounded" alt="${item.name}">
                                </div>
                                <div class="col-md-4">
                                    <h5>${item.name}</h5>
                                    <p class="text-success fw-bold">${formatPrice(item.price)}</p>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Quantity:</label>
                                    <div class="input-group">
                                        <button class="btn btn-outline-secondary" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">-</button>
                                        <input type="number" class="form-control quantity-input" 
                                               value="${item.quantity}" 
                                               min="1" 
                                               max="${item.stock}"
                                               onchange="updateQuantity(${item.id}, parseInt(this.value))">
                                        <button class="btn btn-outline-secondary" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                                    </div>
                                </div>
                                <div class="col-md-2">
                                    <p class="fw-bold">${formatPrice(itemTotal)}</p>
                                </div>
                                <div class="col-md-1">
                                    <button class="btn btn-danger btn-sm" onclick="removeItem(${item.id})">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                updateSummary(total);
            } catch (error) {
                console.error('Error loading cart:', error);
                document.getElementById('cartItems').innerHTML = 
                    '<div class="alert alert-danger">Error loading cart. Please try again.</div>';
            }
        }
        
        async function updateQuantity(cartItemId, quantity) {
            if (quantity < 1) {
                if (confirm('Remove this item from cart?')) {
                    await removeItem(cartItemId);
                }
                return;
            }
            
            try {
                await api.cart.update(cartItemId, quantity);
                await loadCart();
            } catch (error) {
                alert(error.message || 'Failed to update quantity');
                await loadCart();
            }
        }
        
        async function removeItem(cartItemId) {
            if (!confirm('Remove this item from cart?')) {
                return;
            }
            
            try {
                await api.cart.remove(cartItemId);
                await loadCart();
            } catch (error) {
                alert(error.message || 'Failed to remove item');
            }
        }
        
        function updateSummary(subtotal) {
            const tax = subtotal * 0.1;
            const total = subtotal + tax;
            
            document.getElementById('subtotal').textContent = formatPrice(subtotal);
            document.getElementById('tax').textContent = formatPrice(tax);
            document.getElementById('total').textContent = formatPrice(total);
        }
        
        document.getElementById('checkoutBtn').addEventListener('click', function() {
            window.location.href = 'checkout.html';
        });
        document.addEventListener("DOMContentLoaded", renderAuthNav);

        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
